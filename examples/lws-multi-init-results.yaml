apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: multi-init-preflight
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    restartPolicy: None
    workerTemplate:
      spec:
        volumes:
        - name: results
          emptyDir: {}
        initContainers:
        - name: dns-check
          image: busybox:1.36
          command: ["sh", "-ec"]
          args:
          - |
            if nslookup "${LWS_LEADER_ADDRESS}"; then
              echo PASS > /results/dns.status
            else
              echo FAIL > /results/dns.status
            fi
          volumeMounts:
          - name: results
            mountPath: /results
        - name: image-check
          image: alpine:3.22
          command: ["sh", "-ec"]
          args:
          - |
            if test -r /etc/os-release; then
              echo PASS > /results/image.status
            else
              echo FAIL > /results/image.status
            fi
          volumeMounts:
          - name: results
            mountPath: /results
        - name: result-gate
          image: busybox:1.36
          command: ["sh", "-ec"]
          args:
          - |
            cat /results/*.status | tee /results/summary.txt
            ! grep -q '^FAIL$' /results/*.status
          volumeMounts:
          - name: results
            mountPath: /results
        containers:
        - name: workload
          image: busybox:1.36
          command: ["sh", "-ec"]
          args:
          - |
            cat /results/summary.txt
            exec sleep 3600
          volumeMounts:
          - name: results
            mountPath: /results
